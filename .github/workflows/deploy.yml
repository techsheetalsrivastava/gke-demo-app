name: GKE CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: vm-demo-491408
  GKE_CLUSTER: my-standard-cluster
  GKE_ZONE: asia-south1-b
  IMAGE: asia-south1-docker.pkg.dev/vm-demo-491408/my-repo/gke-app:${{ github.sha }}
  USE_GKE_GCLOUD_AUTH_PLUGIN: True

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/216080715515/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-sa@vm-demo-491408.iam.gserviceaccount.com"

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud components install gke-gcloud-auth-plugin --quiet

      - run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build & Push
        run: |
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Get Credentials
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_ZONE

      - name: Deploy
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          kubectl set image deployment/myapp gke-app=$IMAGE

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/myapp         
                                 
                                                             
