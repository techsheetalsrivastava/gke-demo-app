apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: gke-app
          image: asia-south1-docker.pkg.dev/vm-demo-491408/my-repo/gke-app:latest
          ports:
            - containerPort: 3000
